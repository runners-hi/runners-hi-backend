spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.runnershi: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: OFF
    org.springframework.security: WARN
    org.flywaydb: WARN
    com.zaxxer.hikari: WARN
