spring:
  application:
    name: runners-hi-backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production}
  access-token-validity: 3600000       # 1 hour
  refresh-token-validity: 1209600000   # 14 days

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  apple:
    bundle-id: ${APPLE_BUNDLE_ID:}
  kakao:
    admin-key: ${KAKAO_ADMIN_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
