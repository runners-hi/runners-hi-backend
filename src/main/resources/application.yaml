spring:
  application:
    name: runners-hi-backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production}
  access-token-validity: 3600000       # 1 hour
  refresh-token-validity: 1209600000   # 14 days

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  apple:
    bundle-id: ${APPLE_BUNDLE_ID:}
    # 안드로이드 웹 로그인용 Service ID와 등록된 redirect URI
    service-id: ${APPLE_SERVICE_ID:}
    redirect-uri: ${APPLE_REDIRECT_URI:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    private-key: ${APPLE_PRIVATE_KEY:}

storage:
  bucket-name: ${STORAGE_BUCKET_NAME:runners-hi-profile}
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://runnershi-img.oguriworks.com}
  endpoint: ${STORAGE_ENDPOINT:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  # 파일을 두지 않는 환경은 서비스 계정 JSON을 base64로 넣는다
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
