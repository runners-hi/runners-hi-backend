name: Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and build jar
        run: |
          ./gradlew test bootJar --no-daemon
          cp "$(ls build/libs/*.jar | grep -v plain)" deploy/oracle/app.jar

      - name: Deploy to Oracle server
        working-directory: deploy/oracle
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_HOST_KEY: ${{ secrets.ORACLE_HOST_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$ORACLE_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "ubuntu@$ORACLE_HOST" 'rm -rf ~/release && mkdir ~/release'
          scp -i ~/.ssh/id_deploy -r app.jar pages Caddyfile runnershi.service deploy.sh "ubuntu@$ORACLE_HOST:release/"
          ssh -i ~/.ssh/id_deploy "ubuntu@$ORACLE_HOST" 'bash ~/release/deploy.sh'
